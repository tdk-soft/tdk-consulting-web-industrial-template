name: CI - Quality & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Uses GitHub cache to speed up installation

      - name: Install Dependencies
        # npm ci is faster and stricter than npm install for CI
        run: npm ci 

      - name: Lint Check
        # Uses the script defined in your package.json
        run: npm run lint 

      - name: Unit Tests
        run: npm run test:unit

  build-and-push:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        run: echo "Docker build & push logic goes here"
